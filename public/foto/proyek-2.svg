<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)"/>
  
  <!-- Rays background -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="20">
    <line x1="300" y1="200" x2="0" y2="0"/>
    <line x1="300" y1="200" x2="150" y2="0"/>
    <line x1="300" y1="200" x2="300" y2="0"/>
    <line x1="300" y1="200" x2="450" y2="0"/>
    <line x1="300" y1="200" x2="600" y2="0"/>
    <line x1="300" y1="200" x2="600" y2="150"/>
    <line x1="300" y1="200" x2="600" y2="300"/>
    <line x1="300" y1="200" x2="600" y2="400"/>
    <line x1="300" y1="200" x2="0" y2="400"/>
    <line x1="300" y1="200" x2="0" y2="200"/>
  </g>

  <!-- Central Poster Frame -->
  <g transform="translate(140, 40)" filter="url(#shadow2)">
    <rect width="320" height="320" rx="16" fill="#ffffff"/>
    
    <!-- Red Top Ribbon -->
    <path d="M 0 16 Q 0 0 16 0 L 304 0 Q 320 0 320 16 L 320 110 L 0 110 Z" fill="#ef4444"/>
    
    <!-- Flag Emblem -->
    <g transform="translate(125, 45)">
      <rect width="70" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="70" height="11" rx="4" fill="#dc2626"/>
      <rect y="9" width="70" height="2" fill="#dc2626"/>
    </g>

    <!-- Indonesian Independence Text -->
    <text x="160" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#1e293b">DIRGAHAYU</text>
    <text x="160" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#dc2626">REPUBLIK INDONESIA</text>
    <text x="160" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#f59e0b">★ 17 AGUSTUS ★</text>
    <text x="160" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Karya Desain Canva • Mading Sekolah</text>
  </g>
</svg>
