<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <!-- Decorative background circles -->
  <circle cx="500" cy="80" r="140" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="80" cy="320" r="100" fill="#ffffff" fill-opacity="0.06"/>
  <!-- Browser window mockup -->
  <g transform="translate(60, 45)" filter="url(#shadow1)">
    <rect width="480" height="310" rx="14" fill="#ffffff"/>
    <!-- Window header -->
    <rect width="480" height="42" rx="14" fill="#f1f5f9"/>
    <rect y="28" width="480" height="14" fill="#f1f5f9"/>
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <!-- URL bar -->
    <rect x="90" y="11" width="300" height="20" rx="6" fill="#e2e8f0"/>
    <text x="105" y="25" font-family="sans-serif" font-size="11" fill="#64748b">kelas9a.smp.sch.id</text>
    <!-- Window content -->
    <rect x="25" y="60" width="430" height="44" rx="8" fill="#dbeafe"/>
    <text x="40" y="87" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e40af">🎓 Portal &amp; Jadwal Kelas 9A</text>
    <!-- Cards inside -->
    <rect x="25" y="120" width="130" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="40" y="135" width="100" height="10" rx="4" fill="#3b82f6"/>
    <rect x="40" y="155" width="80" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="40" y="170" width="90" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="40" y="185" width="70" height="8" rx="3" fill="#cbd5e1"/>
    
    <rect x="175" y="120" width="130" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="190" y="135" width="100" height="10" rx="4" fill="#10b981"/>
    <rect x="190" y="155" width="85" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="190" y="170" width="75" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="190" y="185" width="90" height="8" rx="3" fill="#cbd5e1"/>

    <rect x="325" y="120" width="130" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="340" y="135" width="100" height="10" rx="4" fill="#8b5cf6"/>
    <rect x="340" y="155" width="80" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="340" y="170" width="85" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="340" y="185" width="70" height="8" rx="3" fill="#cbd5e1"/>
  </g>
</svg>
