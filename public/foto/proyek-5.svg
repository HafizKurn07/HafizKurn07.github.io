<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg5)"/>
  
  <!-- Film Strip Border Top -->
  <g fill="#312e81">
    <rect y="15" width="600" height="24"/>
    <g fill="#ffffff" opacity="0.4">
      <rect x="20" y="21" width="16" height="12" rx="2"/>
      <rect x="60" y="21" width="16" height="12" rx="2"/>
      <rect x="100" y="21" width="16" height="12" rx="2"/>
      <rect x="140" y="21" width="16" height="12" rx="2"/>
      <rect x="180" y="21" width="16" height="12" rx="2"/>
      <rect x="220" y="21" width="16" height="12" rx="2"/>
      <rect x="260" y="21" width="16" height="12" rx="2"/>
      <rect x="300" y="21" width="16" height="12" rx="2"/>
      <rect x="340" y="21" width="16" height="12" rx="2"/>
      <rect x="380" y="21" width="16" height="12" rx="2"/>
      <rect x="420" y="21" width="16" height="12" rx="2"/>
      <rect x="460" y="21" width="16" height="12" rx="2"/>
      <rect x="500" y="21" width="16" height="12" rx="2"/>
      <rect x="540" y="21" width="16" height="12" rx="2"/>
    </g>
  </g>

  <!-- Video Player Mockup -->
  <g transform="translate(110, 65)" filter="url(#shadow5)">
    <!-- Video screen -->
    <rect width="380" height="230" rx="14" fill="#09090b" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Clean School Graphic Inside Screen -->
    <rect x="2" y="2" width="376" height="180" rx="12" fill="#0284c7"/>
    <!-- Sun & Green landscape -->
    <circle cx="320" cy="50" r="28" fill="#fde047"/>
    <path d="M 0 140 Q 90 90 200 130 T 380 120 L 380 182 L 0 182 Z" fill="#15803d"/>
    <path d="M 0 160 Q 140 120 280 150 T 380 140 L 380 182 L 0 182 Z" fill="#22c55e"/>

    <!-- School Building Silhouette -->
    <rect x="70" y="85" width="110" height="65" fill="#f8fafc"/>
    <polygon points="60,85 125,45 190,85" fill="#dc2626"/>
    <!-- Flagpole -->
    <line x1="210" y1="60" x2="210" y2="150" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="210" y="60" width="28" height="18" fill="#ef4444"/>
    <rect x="210" y="69" width="28" height="9" fill="#ffffff"/>

    <!-- Play Button Overlay -->
    <circle cx="190" cy="95" r="30" fill="rgba(15, 23, 42, 0.75)" stroke="#ffffff" stroke-width="2"/>
    <polygon points="183,82 203,95 183,108" fill="#ffffff"/>

    <!-- Video Timeline Bar -->
    <rect x="15" y="195" width="350" height="6" rx="3" fill="#334155"/>
    <rect x="15" y="195" width="180" height="6" rx="3" fill="#ec4899"/>
    <circle cx="195" cy="198" r="6" fill="#ffffff"/>
    
    <!-- Time & Tag -->
    <text x="15" y="218" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">01:42 / 03:00</text>
    <text x="365" y="218" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" fill="#a855f7">HD • CapCut Edit</text>
  </g>

  <!-- Title Bottom -->
  <text x="300" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#f8fafc">DOKUMENTER SEKOLAH SEHAT</text>
  <text x="300" y="365" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#cbd5e1">Karya Video Edukasi SMP • Durasi 3 Menit</text>
</svg>
