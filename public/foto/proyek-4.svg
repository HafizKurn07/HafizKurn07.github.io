<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>
  
  <!-- Circuit Grid Lines in Background -->
  <g stroke="#10b981" stroke-width="2" opacity="0.18">
    <path d="M 40 50 H 200 V 120 H 350"/>
    <path d="M 100 350 H 260 V 280 H 420"/>
    <circle cx="200" cy="120" r="4" fill="#10b981"/>
    <circle cx="260" cy="280" r="4" fill="#10b981"/>
    <circle cx="350" cy="120" r="4" fill="#10b981"/>
  </g>

  <!-- Left: Plant in Pot -->
  <g transform="translate(90, 80)">
    <!-- Soil pot -->
    <polygon points="50,200 150,200 135,270 65,270" fill="#b45309"/>
    <rect x="40" y="190" width="120" height="15" rx="5" fill="#d97706"/>
    <!-- Stem & Leaves -->
    <path d="M 100 190 Q 95 120 100 80" stroke="#22c55e" stroke-width="8" fill="none"/>
    <!-- Leaves -->
    <path d="M 100 150 C 60 140 50 110 80 110 C 100 110 100 140 100 150 Z" fill="#4ade80"/>
    <path d="M 100 120 C 140 110 150 80 120 80 C 100 80 100 110 100 120 Z" fill="#22c55e"/>
    <path d="M 100 80 C 70 60 80 30 100 40 C 120 30 130 60 100 80 Z" fill="#86efac"/>
    
    <!-- Water Droplets dropping from pipe -->
    <path d="M 130 130 C 125 140 135 140 130 130 Z" fill="url(#water)"/>
    <circle cx="100" cy="165" r="5" fill="#38bdf8"/>
    <circle cx="100" cy="178" r="4" fill="#38bdf8"/>
  </g>

  <!-- Right: Microcontroller ESP32 & Display Card -->
  <g transform="translate(320, 70)">
    <!-- Microcontroller Board Mockup -->
    <rect width="210" height="260" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <!-- Chip label -->
    <rect x="25" y="25" width="160" height="36" rx="6" fill="#1e293b"/>
    <text x="105" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="14" fill="#34d399">ESP32 IoT Node</text>
    
    <!-- OLED Display Mockup -->
    <rect x="25" y="80" width="160" height="100" rx="8" fill="#020617" stroke="#334155"/>
    <text x="40" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">SOIL MOISTURE:</text>
    <text x="40" y="140" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="22" fill="#4ade80">32% [DRY]</text>
    <text x="40" y="165" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">⚡ PUMP: ACTIVE ON</text>
    
    <!-- Status LED -->
    <circle cx="45" cy="215" r="8" fill="#10b981"/>
    <text x="65" y="220" font-family="sans-serif" font-size="12" fill="#e2e8f0">Status: Online</text>
    
    <!-- Pins at bottom -->
    <g fill="#94a3b8">
      <rect x="30" y="248" width="6" height="12"/>
      <rect x="45" y="248" width="6" height="12"/>
      <rect x="60" y="248" width="6" height="12"/>
      <rect x="75" y="248" width="6" height="12"/>
      <rect x="130" y="248" width="6" height="12"/>
      <rect x="145" y="248" width="6" height="12"/>
      <rect x="160" y="248" width="6" height="12"/>
      <rect x="175" y="248" width="6" height="12"/>
    </g>
  </g>
</svg>
